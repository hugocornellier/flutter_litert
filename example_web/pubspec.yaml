name: flutter_litert_example_web
description: Web example app for flutter_litert (LiteRT.js runtime), with browser integration tests.
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.11.0

dependencies:
  flutter:
    sdk: flutter
  flutter_litert: ^3.4.1

dev_dependencies:
  flutter_driver:
    sdk: flutter
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  integration_test:
    sdk: flutter

dependency_overrides:
  flutter_litert:
    path: ..

flutter:
  uses-material-design: true
  assets:
    - assets/
