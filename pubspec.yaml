name: flutter_litert
description: LiteRT (formerly TensorFlow Lite) Flutter plugin. Drop-in on-device ML inference with bundled native libraries for supported native platforms and web runtimes.
version: 3.3.2
homepage: https://github.com/hugocornellier/flutter_litert
repository: https://github.com/hugocornellier/flutter_litert
topics:
  - tflite
  - tensorflow-lite
  - litert
  - machine-learning
  - on-device-ml

environment:
  sdk: '>=3.10.0 <4.0.0'
  flutter: '>=3.10.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_web_plugins:
    sdk: flutter
  path: ^1.9.1
  quiver: ^3.2.2
  ffi: ^2.2.0
  web: ^1.1.1

dev_dependencies:
  ffigen: ^10.0.0
  flutter_lints: ^6.0.0
  flutter_test:
    sdk: flutter
  melos: ^7.8.1
  test: ^1.29.0

flutter:
  plugin:
    platforms:
      android:
        ffiPlugin: true
      ios:
        pluginClass: FlutterLitertPlugin
        ffiPlugin: true
      macos:
        ffiPlugin: true
      linux:
        ffiPlugin: true
      windows:
        ffiPlugin: true
      web:
        pluginClass: FlutterLitertWeb
        fileName: flutter_litert_web.dart
