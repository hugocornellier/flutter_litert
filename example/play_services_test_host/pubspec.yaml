name: flutter_litert_play_services_test_host
description: Integration test host for the Google Play services LiteRT runtime.
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.11.0

dependencies:
  flutter:
    sdk: flutter
  flutter_litert: ^4.1.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  integration_test:
    sdk: flutter

dependency_overrides:
  flutter_litert:
    path: ../..

flutter:
  assets:
    - assets/
