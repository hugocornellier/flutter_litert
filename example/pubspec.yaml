name: flutter_litert_example
description: Example app and integration-test host for flutter_litert.
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.11.0
  flutter: '>=3.47.5'

dependencies:
  flutter:
    sdk: flutter
  flutter_litert: ^4.1.1
  opencv_dart: ^2.2.2
  # Require the upstream fix for the hardcoded iOS 12 CMake target (#19). Leave
  # its iOS deployment_target hook setting unset: a value above Flutter's 15.0
  # fails App Store processing with ITMS-90208.
  dartcv4: ^2.3.1

dev_dependencies:
  # Comparison baseline for preprocessing_benchmark_test.dart only.
  image: ^4.3.0
  crypto: ^3.0.6
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  integration_test:
    sdk: flutter
  device_info_plus: ^11.1.0

dependency_overrides:
  flutter_litert:
    path: ../

flutter:
  uses-material-design: true
  assets:
    - assets/
    - assets/models/model_matrix/
    - assets/samples/
