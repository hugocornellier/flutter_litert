name: flutter_litert_example
description: Example app and integration-test host for flutter_litert.
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.11.0

dependencies:
  flutter:
    sdk: flutter
  flutter_litert: ^3.7.0
  flutter_litert_flex: ^1.3.0
  opencv_dart: ^2.2.1+4

dev_dependencies:
  crypto: ^3.0.6
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  integration_test:
    sdk: flutter
  device_info_plus: ^11.1.0

dependency_overrides:
  flutter_litert:
    path: ../

flutter:
  uses-material-design: true
  assets:
    - assets/
    - assets/models/model_matrix/
    - assets/samples/
