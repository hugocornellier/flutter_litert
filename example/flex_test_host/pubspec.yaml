name: flutter_litert_flex_test_host
description: Integration test host for the flutter_litert_flex addon.
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.11.0

dependencies:
  flutter:
    sdk: flutter
  flutter_litert: ^4.1.0
  flutter_litert_flex: ^2.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  integration_test:
    sdk: flutter

dependency_overrides:
  flutter_litert:
    path: ../..
  # TEMP: test the unpublished flutter_litert_flex 2.1.0 (flex rebuilt at TF
  # 2.21.0) before it is on pub.dev. Drop this override before merging.
  flutter_litert_flex:
    git:
      url: https://github.com/hugocornellier/flutter_litert_flex.git
      ref: a363f85ad409473318ea2df4b2fb5203ae1033a3

flutter:
  assets:
    - assets/
