name: build
on:
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - main
      - compiled-model
      - fix/wasm-ready-3.2.0

jobs:
  build-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Enable macOS desktop
        run: flutter config --enable-macos-desktop

      - name: Install dependencies
        run: flutter pub get

      # Repo-wide analyze below needs example_web's package config resolved;
      # a fresh checkout has no .dart_tool there and analyze would fail on
      # its unresolved package: imports.
      - name: Install web example dependencies
        working-directory: example_web
        run: flutter pub get

      - name: Verify formatting
        run: dart format --output=none --set-exit-if-changed .

      - name: Analyze project source
        run: flutter analyze .

      - name: Cache FlexDelegate library (macOS)
        uses: actions/cache@v4
        with:
          path: ~/Library/Caches/flutter_litert
          key: flex-delegate-macos-v1.0.0

      - name: Run tests
        run: flutter test

      - name: Install Flex integration host dependencies
        working-directory: example/flex_test_host
        run: flutter pub get

      - name: Run Flex addon integration tests
        working-directory: example/flex_test_host
        run: flutter test -d macos integration_test

      # Builds the example app and runs real CompiledModel inference inside it,
      # proving the production load path end to end: the podspec ships
      # libLiteRt.dylib as a resource and the loader resolves it from inside
      # the .app rather than from the package checkout. Unlike every other job,
      # the runner has a working GPU here — macOS runners are Apple silicon and
      # Metal compute needs no display — so this is the one place in CI where
      # the strict-GPU and GPU-fallback tests execute for real instead of
      # skipping.
      - name: Run CompiledModel integration tests (macOS desktop)
        working-directory: example
        run: flutter test integration_test/compiled_model_test.dart -d macos --timeout 600s

      - name: Run Interpreter/CompiledModel coexistence tests (macOS desktop)
        working-directory: example
        run: flutter test integration_test/interpreter_coexistence_test.dart -d macos --timeout 600s

      # The classic delegates, on the only runner in this workflow with a real
      # accelerator. All three suites assert hasActiveDelegate, so a delegate
      # that stops applying and silently retries on CPU fails here instead of
      # passing on correct-but-CPU numbers.
      #
      # CoreML is included because its inference test requests AllDevices.
      # The default CoreMlDelegate() targets the Neural Engine only and does
      # not apply on a Mac (or a simulator), so a suite built on the default
      # options would cover nothing but the CPU fallback.
      #
      # The remaining integration_test files stay manual on purpose: they are
      # benchmarks with no assertions, several reading models from absolute
      # paths outside this repo.
      #
      # Separate invocations: passing several integration_test files to one
      # `flutter test` only launches the app for the first.
      - name: Run classic delegate integration tests (macOS desktop)
        working-directory: example
        run: |
          for t in metal_delegate_test xnnpack_delegate_test coreml_delegate_test; do
            echo "::group::$t"
            flutter test "integration_test/$t.dart" -d macos --timeout 600s
            echo "::endgroup::"
          done

  build-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install Linux desktop dependencies
        run: |
          # GitHub-hosted Ubuntu runners preconfigure Microsoft apt repos
          # (packages.microsoft.com) that intermittently return 403 / "no longer
          # signed", which makes "apt-get update" exit 100 even though the build
          # only needs standard Ubuntu packages. Drop those third-party repos
          # first; the glob cannot match the main ubuntu.sources file.
          sudo rm -f /etc/apt/sources.list.d/*microsoft* /etc/apt/sources.list.d/*azure*
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev liblzma-dev xvfb

      - name: Enable Linux desktop
        run: flutter config --enable-linux-desktop

      - name: Install dependencies
        run: flutter pub get

      # Same as build-macos: resolve example_web before the repo-wide analyze.
      - name: Install web example dependencies
        working-directory: example_web
        run: flutter pub get

      - name: Verify formatting
        run: dart format --output=none --set-exit-if-changed .

      - name: Analyze project source
        run: flutter analyze .

      - name: Cache FlexDelegate library (Linux)
        uses: actions/cache@v4
        with:
          path: ~/.cache/flutter_litert
          key: flex-delegate-linux-v1.0.0

      # CompiledModel tests load the bundled linux/lib/libLiteRt.so via the
      # loader's package-path fallback — the same binary end users get.
      - name: Run tests
        run: flutter test

      - name: Install Flex integration host dependencies
        working-directory: example/flex_test_host
        run: flutter pub get

      - name: Run Flex addon integration tests
        working-directory: example/flex_test_host
        run: xvfb-run -a flutter test -d linux integration_test

      # Builds the example app and runs real CompiledModel inference inside
      # it, proving the production load path end to end: CMake bundles
      # linux/lib/libLiteRt.so into the app bundle and the loader resolves it
      # from execDir/lib. GPU tests skip (the bundled WebGPU accelerator
      # finds no adapter on headless runners).
      - name: Run CompiledModel integration tests (Linux desktop)
        working-directory: example
        run: xvfb-run -a flutter test integration_test/compiled_model_test.dart -d linux --timeout 600s

      # Both native runtimes bundled into one app: linux/lib ships
      # libtensorflowlite_c-linux.so alongside libLiteRt.so, and they export
      # overlapping TFLite symbols. Host unit tests only ever load one of them
      # per process, so the collision risk is only visible here.
      - name: Run Interpreter/CompiledModel coexistence tests (Linux desktop)
        working-directory: example
        run: xvfb-run -a flutter test integration_test/interpreter_coexistence_test.dart -d linux --timeout 600s

  build-windows:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install dependencies
        run: flutter pub get

      # Windows has no committed classic TFLite library for host tests, so
      # only the CompiledModel suite runs here, loading the bundled
      # windows/libLiteRt.dll via the loader's package-path fallback. This
      # job also guards the MSVC LiteRtLayout ABI handling (72/76-byte
      # struct sizes).
      - name: Run CompiledModel smoke tests
        run: flutter test test/compiled_model_smoke_test.dart

      # The camera-frame family is pure Dart (no native library, no dart:io),
      # so unlike the rest of test/ it can run on Windows. These cover the
      # seam detector packages hand frames through, which is worth checking on
      # every desktop platform rather than just macOS and Linux.
      - name: Run camera-frame utility tests
        run: >
          flutter test
          test/util/camera_frame_prepare_test.dart
          test/util/camera_frame_test.dart
          test/util/camera_frame_rpc_test.dart
          test/util/yuv_conversion_test.dart
          test/util/cover_fit_transform_test.dart

      # Builds the example app and runs real CompiledModel inference inside
      # it — the only place windows/CMakeLists.txt is configured in CI —
      # proving the production load path end to end: CMake bundles
      # libLiteRt.dll next to the executable and the loader resolves it from
      # execDir. GPU tests skip (the bundled WebGPU accelerator finds no
      # adapter on headless runners).
      - name: Run CompiledModel integration tests (Windows desktop)
        working-directory: example
        run: flutter test integration_test/compiled_model_test.dart -d windows --timeout 600s

      # The classic runtime is exercised on Windows only from inside a built
      # app: windows/CMakeLists.txt bundles libtensorflowlite_c-win.dll next to
      # libLiteRt.dll, so this is where the two runtimes first share a process
      # on this platform.
      - name: Run Interpreter/CompiledModel coexistence tests (Windows desktop)
        working-directory: example
        run: flutter test integration_test/interpreter_coexistence_test.dart -d windows --timeout 600s

  build-web:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install dependencies
        run: flutter pub get

      # Runs the browser-tagged unit tests in headless Chrome (preinstalled on
      # ubuntu-latest). The LiteRT.js runtime and its WASM binary are fetched
      # from cdn.jsdelivr.net at test time. Runners have no GPU, so WebGPU
      # compilation fails and the fallback tests take the WASM path. The
      # detector-utils suite fakes its detector and stubs window.navigator, so
      # every accelerator-resolution and fallback branch runs deterministically
      # here too; the loader suite poisons its page with a bogus module URL on
      # purpose, which is why it is a separate file.
      # The camera-frame tests are appended here because web is a supported
      # platform for the detector packages that call these entry points, and
      # this job runs an explicit file list rather than all of test/.
      # camera_frame_rpc_test is deliberately excluded: TransferableTypedData
      # is native-only, so transferableBytes passes bytes through unchanged on
      # web and the round-trip assertions do not apply.
      - name: Run web unit tests in headless Chrome
        run: >-
          flutter test --platform chrome
          test/compiled_model_web_test.dart
          test/web_detector_utils_web_test.dart
          test/litert_web_loader_test.dart
          test/util/camera_frame_prepare_test.dart
          test/util/camera_frame_test.dart
          test/util/yuv_conversion_test.dart
          test/util/cover_fit_transform_test.dart

      - name: Install web example dependencies
        working-directory: example_web
        run: flutter pub get

      # Real end-to-end inference in a WebDriver-controlled Chrome, two
      # targets: the engine matrix (every web stack running YOLOv8n on the
      # bundled samples and asserting the cats in cat.jpg are found) and the
      # app UI suite (sample picker, settings dialog, status readout).
      # Drives run in profile mode: the integration binding force-enables
      # semantics, and debug builds hit a framework-only semantics assert
      # (rendering/object.dart identical(childRenderObject,
      # parentRenderObject)) when the settings dialog opens over the
      # confidence Slider; profile compiles the asserts out and matches how
      # the example ships.
      # GPU-flavored tests key off a WebGPU capability probe, so on these
      # GPU-less runners they assert the WASM-fallback and failure semantics
      # instead of real WebGPU. ubuntu-latest preinstalls a version-matched
      # chromedriver at $CHROMEWEBDRIVER.
      # The response-data cat runs on failure too: web drives report failure
      # details as an empty string, so the reportData the suites record (the
      # WebGPU probe outcome, and which poll timed out with what on screen)
      # is the only diagnostic a failed run leaves behind.
      - name: Run web integration tests (chromedriver)
        working-directory: example_web
        run: |
          "$CHROMEWEBDRIVER/chromedriver" --port=4444 &
          flutter drive --profile \
            --driver=test_driver/integration_test.dart \
            --target=integration_test/web_object_detection_test.dart \
            -d web-server --browser-name=chrome \
            || { cat build/integration_response_data.json || true; exit 1; }
          cat build/integration_response_data.json || true
          flutter drive --profile \
            --driver=test_driver/integration_test.dart \
            --target=integration_test/web_app_ui_test.dart \
            -d web-server --browser-name=chrome \
            || { cat build/integration_response_data.json || true; exit 1; }
          cat build/integration_response_data.json || true

      # The same engine matrix on Firefox (preinstalled with a matching
      # geckodriver at $GECKOWEBDRIVER), exercising the wasm-directory
      # runtime serving and the WASM fallbacks on a non-Chromium engine.
      - name: Run web integration tests on Firefox (geckodriver)
        working-directory: example_web
        run: |
          "$GECKOWEBDRIVER/geckodriver" --port=4445 &
          flutter drive --profile \
            --driver=test_driver/integration_test.dart \
            --target=integration_test/web_object_detection_test.dart \
            -d web-server --browser-name=firefox --driver-port=4445 \
            || { cat build/integration_response_data.json || true; exit 1; }
          cat build/integration_response_data.json || true

  build-android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Enable KVM for hardware-accelerated emulation
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      # Runs real CompiledModel inference plus the classic Interpreter, which
      # on Android loads a different library entirely (libtensorflowlite_jni.so
      # from litert:1.4.x, next to libLiteRt.so from the 2.x AAR) and is
      # otherwise never executed anywhere in CI. CompiledModel CPU and
      # fallback-factory tests pass. The bundled x86_64 accelerator registers,
      # while direct combined and strict-GPU tests skip because emulators have
      # no working OpenCL. Up to three attempts: Gradle's SDK-component install
      # can receive a corrupted NDK archive ("Error on ZipFile unknown
      # archive"), which fails assembleDebug; purging the partial NDK
      # between attempts makes the retry re-download it cleanly.
      - name: Run integration tests (Android emulator)
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          profile: pixel_6
          working-directory: example
          # One line on purpose: the action runs each script line as its own
          # sh command, which tears a multi-line loop apart.
          #
          # The two suites are separate `flutter test` invocations, not one
          # multi-file invocation: passing several integration_test files to a
          # single run only launches the app for the first one and then fails
          # the rest with "Unable to start the app on the device".
          script: >-
            bash -c 'set +e; rc=1; for attempt in 1 2 3; do
            flutter test integration_test/compiled_model_test.dart -d emulator-5554 --timeout 600s &&
            flutter test integration_test/interpreter_coexistence_test.dart -d emulator-5554 --timeout 600s; rc=$?;
            [ "$rc" -eq 0 ] && break;
            echo "::warning::Android integration tests attempt $attempt failed (rc=$rc)";
            [ "$attempt" -lt 3 ] && rm -rf "$ANDROID_HOME"/ndk/* "$ANDROID_HOME"/.temp;
            done; exit "$rc"'

  # Forward-compatibility guard for newer Android Gradle Plugin (AGP 9.x).
  # The example app pins AGP 8.11.1, so the build-android job above only ever
  # exercises AGP 8. AGP 9 flips android.sourceset.disallowProvider to true and
  # rejects passing a Provider to the legacy jniLibs SourceSet API, which broke
  # consumers on AGP 9 (issue #14). This job rebuilds just the plugin module
  # under AGP 9.x: no emulator and no app compile, but it both catches the
  # configuration-time failure and asserts the native libraries still merge into
  # the AAR (the CMake custom-ops lib plus the downloaded LiteRT Next runtime
  # and GPU accelerator).
  build-android-agp9:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Pin example Android toolchain to AGP 9.x / Gradle 9.x
        working-directory: example/android
        run: |
          sed -i 's/id("com.android.application") version "[0-9.]*"/id("com.android.application") version "9.2.1"/' settings.gradle.kts
          sed -i 's#gradle-[0-9.]*-all.zip#gradle-9.6.1-all.zip#' gradle/wrapper/gradle-wrapper.properties
          echo "--- settings.gradle.kts ---"; grep -n "com.android.application" settings.gradle.kts
          echo "--- gradle-wrapper.properties ---"; grep -n distributionUrl gradle/wrapper/gradle-wrapper.properties

      # The example's gradlew and gradle-wrapper.jar are gitignored, so a fresh
      # checkout has no Gradle wrapper. `flutter build --config-only` regenerates
      # the wrapper and writes local.properties without compiling the app, and it
      # leaves our pinned Gradle version in gradle-wrapper.properties untouched.
      - name: Generate Android project files and Gradle wrapper
        working-directory: example
        run: flutter build apk --config-only --release

      - name: Assemble plugin AAR under AGP 9 (regression guard for issue #14)
        working-directory: example/android
        run: ./gradlew :flutter_litert:assembleRelease --stacktrace

      - name: Assert native libraries merged into the AGP 9 AAR
        run: |
          AAR=example/build/flutter_litert/outputs/aar/flutter_litert-release.aar
          echo "Inspecting $AAR"
          for ABI in arm64-v8a armeabi-v7a x86_64; do
            unzip -l "$AAR" | grep -E "jni/$ABI/libLiteRt\\.so" \
              || { echo "::error::libLiteRt.so missing for $ABI under AGP 9"; exit 1; }
          done
          for ABI in arm64-v8a x86_64; do
            unzip -l "$AAR" | grep -E "jni/$ABI/libLiteRtClGlAccelerator\\.so" \
              || { echo "::error::GPU accelerator missing for $ABI under AGP 9"; exit 1; }
          done
          if unzip -l "$AAR" | grep -q -E 'jni/armeabi-v7a/libLiteRtClGlAccelerator\.so'; then
            echo '::error::GPU accelerator must not be packaged for armeabi-v7a'
            exit 1
          fi
          unzip -l "$AAR" | grep -E 'jni/.*/libtflite_custom_ops\.so' \
            || { echo '::error::CMake custom-ops .so missing from AAR under AGP 9'; exit 1; }
          echo 'AGP 9 build packaged the expected native libraries.'

  build-ios:
    runs-on: macos-15
    # Per-test, per-attempt timeouts and retries live in the test step below.
    # This outer cap only bounds the complete three-test sequence.
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Select Xcode 16.4
        run: |
          sudo xcode-select -s /Applications/Xcode_16.4.app/Contents/Developer
          xcodebuild -version
          test "$(xcodebuild -version | head -n 1)" = "Xcode 16.4"

      - name: Install dependencies
        run: flutter pub get

      - name: Stage patched Core ML framework for SwiftPM tests
        run: |
          ./scripts/use_local_coreml_xcframework.sh \
            "$GITHUB_WORKSPACE/ios/TensorFlowLiteCCoreML.xcframework"

      - name: Boot iOS simulator
        run: |
          UDID=$(xcrun simctl list devices available --json | python3 -c "
          import json, sys
          devices = json.load(sys.stdin)['devices']
          iphones = [d for v in devices.values() for d in v if 'iPhone' in d['name']]
          print(iphones[-1]['udid'])
          ")
          xcrun simctl boot "$UDID" || true
          # Block until the simulator is fully booted before any app launch.
          # Launching the test app on a not-yet-ready simulator was the cause of
          # the connect-forever hangs (build succeeds, driver never attaches).
          xcrun simctl bootstatus "$UDID" -b
          open -a Simulator --args -CurrentDeviceUDID "$UDID" || true
          echo "SIMULATOR_UDID=$UDID" >> "$GITHUB_ENV"

      - name: Run integration tests on iOS simulator
        working-directory: example
        run: |
          set +e
          # A successful suite takes 2-5 minutes here including the app build,
          # so 900s leaves roughly 3x headroom while bounding the damage when
          # the simulator wedges on launch (the connect-forever hang the
          # recycle logic below exists for). At the previous 1500s a single
          # hang burned 25 minutes, and three hung first attempts would exceed
          # this job's 90-minute cap and be killed mid-run; at 900s the worst
          # case is about an hour.
          attempt_timeout=900
          max=2

          run_ios_test() {
            test_file="$1"
            rc=1
            for attempt in $(seq 1 "$max"); do
              timeout_marker="$RUNNER_TEMP/ios-timeout-$(basename "$test_file")-$attempt"
              rm -f "$timeout_marker"
              echo "::group::$test_file (attempt $attempt/$max)"
              flutter test "$test_file" \
                -d "$SIMULATOR_UDID" --timeout 600s &
              pid=$!
              ( sleep "$attempt_timeout"
                if kill -0 "$pid" 2>/dev/null; then
                  touch "$timeout_marker"
                  echo "::warning::$test_file exceeded ${attempt_timeout}s; killing"
                  kill -TERM "$pid" 2>/dev/null
                  sleep 15
                  kill -KILL "$pid" 2>/dev/null
                fi ) &
              watchdog=$!
              wait "$pid"
              rc=$?
              kill -TERM "$watchdog" 2>/dev/null
              wait "$watchdog" 2>/dev/null
              if [ -f "$timeout_marker" ]; then
                # Flutter may exit zero after handling SIGTERM. Preserve the
                # timeout as a failure so a killed test can never go green.
                rc=124
              fi
              rm -f "$timeout_marker"
              echo "::endgroup::"
              if [ "$rc" -eq 0 ]; then
                echo "$test_file passed on attempt $attempt"
                return 0
              fi
              echo "::warning::$test_file attempt $attempt failed/timed out (rc=$rc)"
              if [ "$attempt" -lt "$max" ]; then
                echo "Recycling simulator before retry"
                # The watchdog kill above only reaches the flutter process;
                # its xcodebuild/XCBBuildService children survive and keep
                # DerivedData's build database locked, so without reaping
                # them the retry dies on "unable to attach DB: database is
                # locked ... two concurrent builds".
                pkill -9 xcodebuild 2>/dev/null || true
                pkill -9 -f XCBBuildService 2>/dev/null || true
                xcrun simctl shutdown "$SIMULATOR_UDID" 2>/dev/null || true
                xcrun simctl boot "$SIMULATOR_UDID" 2>/dev/null || true
                xcrun simctl bootstatus "$SIMULATOR_UDID" -b
              fi
            done
            return "$rc"
          }

          run_ios_test integration_test/compiled_model_test.dart || exit $?
          run_ios_test integration_test/ios_compiled_model_npu_test.dart || exit $?
          run_ios_test integration_test/interpreter_delegate_fallback_test.dart || exit $?
          run_ios_test integration_test/interpreter_coexistence_test.dart || exit $?
