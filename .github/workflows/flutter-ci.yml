name: build
on:
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - main
      - compiled-model
      - fix/wasm-ready-3.2.0

# One Flutter version for every job, so a new stable release cannot change CI
# between two runs of the same commit: Flutter 3.50.0 (2026-11-11) needed
# AGP 9 and Gradle 9 changes before CI passed again. Raise it on purpose, in a
# change of its own, when a new stable is out. mediapipe_flutter pins its
# Flutter version the same way.
env:
  FLUTTER_VERSION: '3.50.0'

jobs:
  build-macos:
    # macos-latest is macos-26 today and moves when GitHub retargets the
    # label; a named image changes only when this line does.
    runs-on: macos-26
    # Takes 17 minutes, 23 at most in 83 runs.
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - name: Enable macOS desktop
        run: flutter config --enable-macos-desktop

      - name: Install dependencies
        run: flutter pub get

      # Repo-wide analyze below needs example_web's package config resolved;
      # a fresh checkout has no .dart_tool there and analyze would fail on
      # its unresolved package: imports.
      - name: Install web example dependencies
        working-directory: example_web
        run: flutter pub get

      - name: Verify formatting
        run: dart format --output=none --set-exit-if-changed .

      - name: Analyze project source
        run: flutter analyze .

      - name: Run tests
        run: flutter test

      - name: Install Flex integration host dependencies
        working-directory: example/flex_test_host
        run: flutter pub get

      # The host builds with Swift Package Manager, which downloads
      # flutter_litert_flex's flex xcframework (a binaryTarget pinned by URL
      # and checksum) into SwiftPM's shared artifact cache. pubspec.lock pins
      # the flex version, so the key follows it; a stale entry is harmless
      # because SwiftPM checks the checksum.
      - name: Cache FlexDelegate library (macOS)
        uses: actions/cache@v6
        with:
          path: ~/Library/Caches/org.swift.swiftpm/artifacts
          key: flex-delegate-macos-${{ hashFiles('example/flex_test_host/pubspec.lock') }}

      - name: Run Flex addon integration tests
        working-directory: example/flex_test_host
        run: flutter test -d macos integration_test

      # Builds the example app and runs real CompiledModel inference inside it,
      # proving the production load path end to end: the podspec ships
      # libLiteRt.dylib as a resource and the loader resolves it from inside
      # the .app rather than from the package checkout. Unlike every other job,
      # the runner has a working GPU here; macOS runners are Apple silicon and
      # Metal compute needs no display, so this is the one place in CI where
      # the strict-GPU and GPU-fallback tests execute for real instead of
      # skipping.
      - name: Run CompiledModel integration tests (macOS desktop)
        working-directory: example
        run: flutter test integration_test/compiled_model_test.dart -d macos --timeout 600s

      - name: Run Interpreter/CompiledModel coexistence tests (macOS desktop)
        working-directory: example
        run: flutter test integration_test/interpreter_coexistence_test.dart -d macos --timeout 600s

      # The classic delegates, on the only runner in this workflow with a real
      # accelerator. All three suites assert hasActiveDelegate, so a delegate
      # that stops applying and silently retries on CPU fails here instead of
      # passing on correct-but-CPU numbers.
      #
      # CoreML is included because its inference test requests AllDevices.
      # The default CoreMlDelegate() targets the Neural Engine only and does
      # not apply on a Mac (or a simulator), so a suite built on the default
      # options would cover nothing but the CPU fallback.
      #
      # The remaining integration_test files stay manual on purpose: they are
      # benchmarks with no assertions, several reading models from absolute
      # paths outside this repo.
      #
      # Separate invocations: passing several integration_test files to one
      # `flutter test` only launches the app for the first.
      - name: Run classic delegate integration tests (macOS desktop)
        working-directory: example
        run: |
          for t in metal_delegate_test xnnpack_delegate_test coreml_delegate_test; do
            echo "::group::$t"
            flutter test "integration_test/$t.dart" -d macos --timeout 600s
            echo "::endgroup::"
          done

  build-linux:
    runs-on: ubuntu-24.04
    # Takes 8 minutes, 18 at most in 82 runs.
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      # Without the Microsoft apt sources, with retries and time limits, and
      # from another Ubuntu mirror when the runner's own one fails or stalls.
      - name: Install Linux desktop dependencies
        uses: ./.github/actions/apt-install
        with:
          packages: clang cmake ninja-build pkg-config libgtk-3-dev liblzma-dev xvfb

      - name: Enable Linux desktop
        run: flutter config --enable-linux-desktop

      - name: Install dependencies
        run: flutter pub get

      # Same as build-macos: resolve example_web before the repo-wide analyze.
      - name: Install web example dependencies
        working-directory: example_web
        run: flutter pub get

      - name: Verify formatting
        run: dart format --output=none --set-exit-if-changed .

      - name: Analyze project source
        run: flutter analyze .

      # CompiledModel tests load the bundled linux/lib/libLiteRt.so via the
      # loader's package-path fallback, the same binary end users get.
      - name: Run tests
        run: flutter test

      - name: Install Flex integration host dependencies
        working-directory: example/flex_test_host
        run: flutter pub get

      # flutter_litert_flex's linux/CMakeLists.txt downloads the flex library
      # into its own package directory and checks it against a pinned SHA-256.
      # Cache that file. pubspec.lock pins the flex version, so the key follows
      # it; a stale file is harmless because CMake downloads it again when the
      # SHA-256 differs.
      - name: Locate FlexDelegate library (Linux)
        id: flex-linux
        working-directory: example/flex_test_host
        run: |
          root=$(python3 -c "import json, urllib.parse; print([urllib.parse.urlparse(p['rootUri']).path for p in json.load(open('.dart_tool/package_config.json'))['packages'] if p['name'] == 'flutter_litert_flex'][0])")
          echo "path=$root/linux/libtensorflowlite_flex-linux.so" >> "$GITHUB_OUTPUT"

      - name: Cache FlexDelegate library (Linux)
        uses: actions/cache@v6
        with:
          path: ${{ steps.flex-linux.outputs.path }}
          key: flex-delegate-linux-${{ hashFiles('example/flex_test_host/pubspec.lock') }}

      - name: Run Flex addon integration tests
        working-directory: example/flex_test_host
        run: xvfb-run -a flutter test -d linux integration_test

      # Builds the example app and runs real CompiledModel inference inside
      # it, proving the production load path end to end: CMake bundles
      # linux/lib/libLiteRt.so into the app bundle and the loader resolves it
      # from execDir/lib. GPU tests skip (the bundled WebGPU accelerator
      # finds no adapter on headless runners).
      - name: Run CompiledModel integration tests (Linux desktop)
        working-directory: example
        run: xvfb-run -a flutter test integration_test/compiled_model_test.dart -d linux --timeout 600s

      # Both native runtimes bundled into one app: linux/lib ships
      # libtensorflowlite_c-linux.so alongside libLiteRt.so, and they export
      # overlapping TFLite symbols. Host unit tests only ever load one of them
      # per process, so the collision risk is only visible here.
      - name: Run Interpreter/CompiledModel coexistence tests (Linux desktop)
        working-directory: example
        run: xvfb-run -a flutter test integration_test/interpreter_coexistence_test.dart -d linux --timeout 600s

  build-windows:
    runs-on: windows-2022
    # Takes 11 minutes, 13 at most in 77 runs.
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - name: Install dependencies
        run: flutter pub get

      # Windows has no committed classic TFLite library for host tests, so
      # only the CompiledModel suite runs here, loading the bundled
      # windows/libLiteRt.dll via the loader's package-path fallback. This
      # job also guards the LiteRtLayout ABI on an MSVC build (68/72-byte
      # struct sizes since LiteRT 2.3.0).
      - name: Run CompiledModel smoke tests
        run: flutter test test/compiled_model_smoke_test.dart

      # The camera-frame family is pure Dart (no native library, no dart:io),
      # so unlike the rest of test/ it can run on Windows. These cover the
      # seam detector packages hand frames through, which is worth checking on
      # every desktop platform rather than just macOS and Linux.
      - name: Run camera-frame utility tests
        run: >
          flutter test
          test/util/camera_frame_prepare_test.dart
          test/util/camera_frame_test.dart
          test/util/camera_frame_rpc_test.dart
          test/util/yuv_conversion_test.dart
          test/util/cover_fit_transform_test.dart

      # Builds the example app and runs real CompiledModel inference inside
      # it, configuring windows/CMakeLists.txt in CI and proving the production
      # load path end to end: CMake bundles
      # libLiteRt.dll next to the executable and the loader resolves it from
      # execDir. GPU tests skip (the bundled WebGPU accelerator finds no
      # adapter on headless runners).
      - name: Run CompiledModel integration tests (Windows desktop)
        working-directory: example
        run: flutter test integration_test/compiled_model_test.dart -d windows --timeout 600s

      # The classic runtime is exercised on Windows only from inside a built
      # app: windows/CMakeLists.txt bundles libtensorflowlite_c-win.dll next to
      # libLiteRt.dll, so this is where the two runtimes first share a process
      # on this platform.
      - name: Run Interpreter/CompiledModel coexistence tests (Windows desktop)
        working-directory: example
        run: flutter test integration_test/interpreter_coexistence_test.dart -d windows --timeout 600s

  # The Flex addon host on Windows, as its own job: inference, training and
  # weight persistence through libtensorflowlite_flex-win.dll inside a built
  # app. That DLL imports vcruntime140_threads.dll, which the runner image
  # does not have to provide: windows/CMakeLists.txt bundles it next to the
  # executable.
  build-windows-flex:
    runs-on: windows-2022
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - name: Install Flex integration host dependencies
        working-directory: example/flex_test_host
        run: flutter pub get

      # flutter_litert_flex's windows/CMakeLists.txt downloads the flex DLL
      # (about 240 MB) into its own package directory and checks it against a
      # pinned SHA-256. Cache that file. pubspec.lock pins the flex version, so
      # the key follows it; a stale file is harmless because CMake downloads it
      # again when the SHA-256 differs.
      #
      # rootUri is a file: URI for a hosted or git dependency (its path reads
      # /C:/... on Windows, which url2pathname turns into C:\...) and a path
      # relative to .dart_tool for a path dependency.
      - name: Locate FlexDelegate library (Windows)
        id: flex-windows
        working-directory: example/flex_test_host
        shell: bash
        run: |
          python - >> "$GITHUB_OUTPUT" <<'PY'
          import json, os, urllib.parse, urllib.request
          packages = json.load(open('.dart_tool/package_config.json'))['packages']
          uri = [p['rootUri'] for p in packages if p['name'] == 'flutter_litert_flex'][0]
          parsed = urllib.parse.urlparse(uri)
          if parsed.scheme == 'file':
              root = urllib.request.url2pathname(parsed.path)
          else:
              root = os.path.join('.dart_tool', urllib.request.url2pathname(uri))
          root = os.path.abspath(root)
          print('path=' + os.path.join(root, 'windows', 'libtensorflowlite_flex-win.dll'))
          PY

      - name: Cache FlexDelegate library (Windows)
        uses: actions/cache@v6
        with:
          path: ${{ steps.flex-windows.outputs.path }}
          key: flex-delegate-windows-${{ hashFiles('example/flex_test_host/pubspec.lock') }}

      - name: Run Flex addon integration tests
        working-directory: example/flex_test_host
        timeout-minutes: 30
        run: flutter test -d windows integration_test

  # Checks the iOS frameworks consumers actually download, for both packaging
  # channels. build-ios cannot cover this: it redirects the SwiftPM binary
  # target at the working-copy xcframework, so it validates the framework on
  # disk rather than the published artifact. Two shipping bugs reached users
  # through that gap (a stale SwiftPM pin, then a CocoaPods bundle whose Core ML
  # framework never carried the NPU entry points), both silent at build time.
  # Runs on Linux: the check reads Mach-O string tables and verifies checksums,
  # neither of which needs Xcode, so it stays off the contended macOS runners.
  verify-published-ios-frameworks:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - name: Verify published iOS frameworks carry the Core ML NPU entry points
        run: ./scripts/verify_published_ios_frameworks.sh

  build-web:
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v7
      - uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - name: Install dependencies
        run: flutter pub get

      # Runs the browser-tagged unit tests in headless Chrome (preinstalled on
      # ubuntu-latest). The LiteRT.js runtime and its WASM binary are fetched
      # from cdn.jsdelivr.net at test time. Runners have no GPU, so WebGPU
      # compilation fails and the fallback tests take the WASM path. The
      # detector-utils suite fakes its detector and stubs window.navigator, so
      # every accelerator-resolution and fallback branch runs deterministically
      # here too; the loader suite poisons its page with a bogus module URL on
      # purpose, which is why it is a separate file.
      # The camera-frame tests are appended here because web is a supported
      # platform for the detector packages that call these entry points, and
      # this job runs an explicit file list rather than all of test/.
      # camera_frame_rpc_test is deliberately excluded: TransferableTypedData
      # is native-only, so transferableBytes passes bytes through unchanged on
      # web and the round-trip assertions do not apply.
      - name: Run web unit tests in headless Chrome
        run: >-
          flutter test --platform chrome
          test/compiled_model_web_test.dart
          test/litertjs_multi_input_web_test.dart
          test/web_detector_utils_web_test.dart
          test/litert_web_loader_test.dart
          test/util/camera_frame_prepare_test.dart
          test/util/camera_frame_test.dart
          test/util/yuv_conversion_test.dart
          test/util/cover_fit_transform_test.dart

      - name: Install web example dependencies
        working-directory: example_web
        run: flutter pub get

      # Real end-to-end inference in a WebDriver-controlled Chrome, two
      # targets: the engine matrix (every web stack running YOLOv8n on the
      # bundled samples and asserting the cats in cat.jpg are found) and the
      # app UI suite (sample picker, settings dialog, status readout).
      # Drives run in profile mode: the integration binding force-enables
      # semantics, and debug builds hit a framework-only semantics assert
      # (rendering/object.dart identical(childRenderObject,
      # parentRenderObject)) when the settings dialog opens over the
      # confidence Slider; profile compiles the asserts out and matches how
      # the example ships.
      # GPU-flavored tests key off a WebGPU capability probe, so on these
      # GPU-less runners they assert the WASM-fallback and failure semantics
      # instead of real WebGPU. ubuntu-latest preinstalls a version-matched
      # chromedriver at $CHROMEWEBDRIVER.
      # The response-data cat runs on failure too: web drives report failure
      # details as an empty string, so the reportData the suites record (the
      # WebGPU probe outcome, and which poll timed out with what on screen)
      # is the only diagnostic a failed run leaves behind.
      - name: Run web integration tests (chromedriver)
        working-directory: example_web
        run: |
          "$CHROMEWEBDRIVER/chromedriver" --port=4444 &
          flutter drive --profile \
            --driver=test_driver/integration_test.dart \
            --target=integration_test/web_object_detection_test.dart \
            -d web-server --browser-name=chrome \
            || { cat build/integration_response_data.json || true; exit 1; }
          cat build/integration_response_data.json || true
          flutter drive --profile \
            --driver=test_driver/integration_test.dart \
            --target=integration_test/web_app_ui_test.dart \
            -d web-server --browser-name=chrome \
            || { cat build/integration_response_data.json || true; exit 1; }
          cat build/integration_response_data.json || true

      # The same engine matrix on Firefox (preinstalled with a matching
      # geckodriver at $GECKOWEBDRIVER), exercising the wasm-directory
      # runtime serving and the WASM fallbacks on a non-Chromium engine.
      - name: Run web integration tests on Firefox (geckodriver)
        working-directory: example_web
        run: |
          "$GECKOWEBDRIVER/geckodriver" --port=4445 &
          flutter drive --profile \
            --driver=test_driver/integration_test.dart \
            --target=integration_test/web_object_detection_test.dart \
            -d web-server --browser-name=firefox --driver-port=4445 \
            || { cat build/integration_response_data.json || true; exit 1; }
          cat build/integration_response_data.json || true

  build-android:
    runs-on: ubuntu-24.04
    # Takes 11 minutes, 23 at most in 84 runs. A stall must end here, not at
    # the 6 hour limit.
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: gradle
      # A fresh runner has no debug keystore. With AGP 9.3.3 the first debug
      # build creates ~/.android/debug.keystore and later builds create and use
      # ~/.config/.android/debug.keystore, so APKs from one job are signed with
      # two different keys and installing the second fails with
      # INSTALL_FAILED_UPDATE_INCOMPATIBLE. One keystore in both places keeps
      # every build on the same key.
      - name: Use one debug keystore for every build
        run: |
          mkdir -p ~/.android ~/.config/.android
          [ -f ~/.android/debug.keystore ] || keytool -genkeypair -keystore ~/.android/debug.keystore \
            -storepass android -keypass android -alias androiddebugkey \
            -dname "CN=Android Debug,O=Android,C=US" -keyalg RSA -keysize 2048 -validity 10000 -noprompt
          cp ~/.android/debug.keystore ~/.config/.android/debug.keystore
      # Gradle downloads come from the cache where it can, and plugins from
      # Maven Central directly instead of through the plugin portal's redirect,
      # which answered 429 or served nothing in two runs on 2026-11-12.
      - uses: ./.github/actions/gradle-plugin-repositories
      - uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Enable KVM for hardware-accelerated emulation
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      # The emulator step downloads these itself, once each, and a download
      # that arrived broken failed 2 jobs before any test ran. Here each one
      # gets three tries, and the emulator step finds them installed.
      - name: Download the emulator and its system image
        run: bash scripts/android_sdk_packages.sh emulator 'system-images;android-34;default;x86_64'

      # Runs real CompiledModel inference plus the classic Interpreter. Both
      # load from the one libLiteRt.so of the litert 2.x AAR on Android, and
      # interpreter_coexistence_test checks that they share it without
      # clashing. CompiledModel CPU and fallback-factory tests pass. The bundled x86_64 accelerator registers,
      # while direct combined and strict-GPU tests skip because emulators have
      # no working OpenCL.
      #
      # scripts/android_flutter_test.sh runs each suite: it ends a launch that
      # installs the app and then starts no test, and builds again only when
      # Gradle's NDK download breaks off. Neither a launch nor a test is tried
      # again, so a flaky test shows up red here instead of hiding behind a
      # retry.
      - name: Run integration tests (Android emulator)
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          profile: pixel_6
          ram-size: 4096M
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim
          working-directory: example
          # The action runs each script line as its own sh command and stops
          # at the first one that fails.
          #
          # The two suites are separate `flutter test` invocations, not one
          # multi-file invocation: passing several integration_test files to a
          # single run only launches the app for the first one and then fails
          # the rest with "Unable to start the app on the device".
          script: |
            bash ../scripts/android_flutter_test.sh integration_test/compiled_model_test.dart --timeout 600s
            bash ../scripts/android_flutter_test.sh integration_test/interpreter_coexistence_test.dart --timeout 600s

      # Kept when the job did not pass: the device log shows what the emulator
      # did while flutter test was silent.
      - name: Upload Android test logs
        if: failure() || cancelled()
        uses: actions/upload-artifact@v4
        with:
          name: android-test-logs-${{ github.job }}
          path: build/android-test-logs/

      # The default runtime must keep packaging LiteRT itself and never pull
      # in the Play services clients that flutterLitert.runtime=playServices
      # uses.
      - name: Check the APK packages the bundled runtime only
        run: >-
          python3 -I scripts/check_android_runtime_apk.py --runtime bundled
          example/build/app/outputs/flutter-apk/app-debug.apk

  # flutterLitert.runtime=playServices (issue #23): LiteRT comes from Google
  # Play services instead of the APK. example/play_services_test_host is built
  # with that property: a small app that sets the mode in its own
  # gradle.properties and holds the Play services tests, apart from the main
  # example and its bundled-runtime suites. This job builds the host's debug
  # and release (R8) APKs and checks that they package the Play services
  # runtime only. Its emulator test failed its first attempt in 23 of 43
  # runs, so it is out of this workflow and lives in device-tests-manual.yml.
  build-android-play-services:
    runs-on: ubuntu-24.04
    # A stall must end the job in an hour, not at the 6 hour limit.
    timeout-minutes: 60
    steps:
      # This job builds several APKs, which can fill the runner's disk. It
      # does not use these preinstalled toolchains.
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/.ghcup /opt/hostedtoolcache/CodeQL
          df -h /

      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: gradle
      # One debug keystore for every build, explained at build-android.
      - name: Use one debug keystore for every build
        run: |
          mkdir -p ~/.android ~/.config/.android
          [ -f ~/.android/debug.keystore ] || keytool -genkeypair -keystore ~/.android/debug.keystore \
            -storepass android -keypass android -alias androiddebugkey \
            -dname "CN=Android Debug,O=Android,C=US" -keyalg RSA -keysize 2048 -validity 10000 -noprompt
          cp ~/.android/debug.keystore ~/.config/.android/debug.keystore
      # Gradle plugins from Maven Central directly, explained at build-android.
      - uses: ./.github/actions/gradle-plugin-repositories
      - uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - name: Install host dependencies
        working-directory: example/play_services_test_host
        run: flutter pub get

      - name: Analyze the host
        working-directory: example/play_services_test_host
        run: flutter analyze

      # The shared Gradle action installed the NDK already. Should a Flutter
      # or AGP update want another one, this first Gradle build downloads it,
      # and that download can break off and leave a corrupted archive ("Error
      # on ZipFile unknown archive"), which fails assembleDebug. Only in that
      # case the partial NDK is purged and the build runs again, up to three
      # attempts; any other build failure fails the step at once.
      - name: Build the Play services host APK
        working-directory: example/play_services_test_host
        run: |
          for attempt in 1 2 3; do
            flutter build apk --debug 2>&1 | tee "$RUNNER_TEMP/host-build.log"
            rc=${PIPESTATUS[0]}
            [ "$rc" -eq 0 ] && exit 0
            grep -q "preparing SDK package NDK" "$RUNNER_TEMP/host-build.log" || exit "$rc"
            echo "::warning::the NDK download broke off in attempt $attempt (rc=$rc)"
            rm -rf "$ANDROID_HOME"/ndk/* "$ANDROID_HOME"/.temp
          done
          exit "$rc"

      - name: Check the APK packages the Play services runtime only
        run: >-
          python3 -I scripts/check_android_runtime_apk.py --runtime playServices
          example/play_services_test_host/build/app/outputs/flutter-apk/app-debug.apk

      # Release builds shrink the plugin's Java and Kotlin with R8, which a
      # debug build never sees. lib/release_smoke.dart runs both runtimes once
      # when launched (device-tests-manual.yml launches it on an emulator).
      - name: Build the Play services release smoke APK (R8)
        working-directory: example/play_services_test_host
        run: flutter build apk --release -t lib/release_smoke.dart --dart-define=FLUTTER_LITERT_EXPECT_RUNTIME=playServices

      - name: Check the release APK packages the Play services runtime only
        run: >-
          python3 -I scripts/check_android_runtime_apk.py --runtime playServices
          example/play_services_test_host/build/app/outputs/flutter-apk/app-release.apk

  # The same host on an emulator image without Google Play services:
  # initializeAndroidRuntime() must fail promptly with both reasons instead of
  # hanging, and models must keep reporting the failure. Rebuilt with
  # flutterLitert.runtime=auto, it must fall back to the bundled runtime, in
  # the integration test and in the release smoke APK.
  build-android-no-play-services:
    runs-on: ubuntu-24.04
    # Takes 7 minutes, 9 at most in 39 runs.
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: gradle
      # One debug keystore for every build, explained at build-android.
      - name: Use one debug keystore for every build
        run: |
          mkdir -p ~/.android ~/.config/.android
          [ -f ~/.android/debug.keystore ] || keytool -genkeypair -keystore ~/.android/debug.keystore \
            -storepass android -keypass android -alias androiddebugkey \
            -dname "CN=Android Debug,O=Android,C=US" -keyalg RSA -keysize 2048 -validity 10000 -noprompt
          cp ~/.android/debug.keystore ~/.config/.android/debug.keystore
      # Gradle plugins from Maven Central directly, explained at build-android.
      - uses: ./.github/actions/gradle-plugin-repositories
      - uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - name: Install host dependencies
        working-directory: example/play_services_test_host
        run: flutter pub get

      - name: Enable KVM for hardware-accelerated emulation
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      # With three tries each, as in build-android.
      - name: Download the emulator and its system image
        run: bash scripts/android_sdk_packages.sh emulator 'system-images;android-34;default;x86_64'

      # No launch or test is tried again, as in build-android.
      - name: Run the no Play services integration test (Android emulator)
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: default
          arch: x86_64
          profile: pixel_6
          ram-size: 4096M
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim
          working-directory: example/play_services_test_host
          # One sh command per line, as in build-android.
          script: |
            bash ../../scripts/android_flutter_test.sh integration_test/no_play_services_test.dart --timeout 600s
            env ORG_GRADLE_PROJECT_flutterLitert.runtime=auto bash ../../scripts/android_flutter_test.sh integration_test/auto_runtime_test.dart --dart-define=FLUTTER_LITERT_EXPECT_RUNTIME=bundled --timeout 600s
            env ORG_GRADLE_PROJECT_flutterLitert.runtime=auto flutter build apk --release -t lib/release_smoke.dart --dart-define=FLUTTER_LITERT_EXPECT_RUNTIME=bundled
            python3 -I ../../scripts/check_android_runtime_apk.py --runtime auto build/app/outputs/flutter-apk/app-release.apk
            bash ../../scripts/android_release_smoke.sh build/app/outputs/flutter-apk/app-release.apk emulator-5554 600

      # Kept when the job did not pass: the device log shows what the emulator
      # did while flutter test was silent.
      - name: Upload Android test logs
        if: failure() || cancelled()
        uses: actions/upload-artifact@v4
        with:
          name: android-test-logs-${{ github.job }}
          path: build/android-test-logs/

  # Second Android Gradle Plugin version guard. The example app pins AGP 9.3.3
  # and Gradle 9.5.0 (the versions Flutter 3.50 asks for), which the
  # build-android job above exercises; this job moves every com.android plugin
  # to AGP 9.2.1 on Gradle 9.6.1. AGP 9 flips android.sourceset.disallowProvider
  # to true and rejects passing a Provider to the legacy jniLibs SourceSet API,
  # which broke consumers on AGP 9 (issue #14). This job rebuilds just the
  # plugin module under AGP 9.x: no emulator and no app compile, but it both
  # catches the configuration-time failure and asserts the native libraries
  # still merge into the AAR (the CMake custom-ops lib plus the downloaded
  # LiteRT Next runtime and GPU accelerator).
  build-android-agp9:
    runs-on: ubuntu-24.04
    # Takes 4 minutes, 7 at most in 86 runs.
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: gradle
      # Gradle plugins from Maven Central directly, explained at build-android.
      - uses: ./.github/actions/gradle-plugin-repositories
      - uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Pin example Android toolchain to AGP 9.x / Gradle 9.x
        working-directory: example/android
        run: |
          sed -i 's/id("\(com\.android\.[a-z-]*\)") version "[0-9.]*"/id("\1") version "9.2.1"/' settings.gradle.kts
          sed -i 's#gradle-[0-9.]*-all.zip#gradle-9.6.1-all.zip#' gradle/wrapper/gradle-wrapper.properties
          echo "--- settings.gradle.kts ---"; grep -n "com.android" settings.gradle.kts
          echo "--- gradle-wrapper.properties ---"; grep -n distributionUrl gradle/wrapper/gradle-wrapper.properties
          # The pinned Gradle is not the one the shared action downloaded.
          ../../scripts/gradle_distribution.sh gradle/wrapper/gradle-wrapper.properties

      # The example's gradlew and gradle-wrapper.jar are gitignored, so a fresh
      # checkout has no Gradle wrapper. `flutter build --config-only` regenerates
      # the wrapper and writes local.properties without compiling the app, and it
      # leaves our pinned Gradle version in gradle-wrapper.properties untouched.
      - name: Generate Android project files and Gradle wrapper
        working-directory: example
        run: flutter build apk --config-only --release

      # The shared Gradle action installed the NDK AGP 9.2.1 builds with
      # (28.2.13676358, not on the runner image). Should an update want
      # another one, this first Gradle build downloads it, and that download
      # can break off and leave a corrupted archive (on 2026-11-12 it took 9
      # minutes and ended in "Archive is not a ZIP archive"), which fails the
      # build. Only in that case the partial NDK is purged and the build runs
      # again, up to three attempts; any other build failure fails the step
      # at once.
      - name: Assemble plugin AAR under AGP 9 (regression guard for issue #14)
        working-directory: example/android
        run: |
          for attempt in 1 2 3; do
            ./gradlew :flutter_litert:assembleRelease --stacktrace 2>&1 | tee "$RUNNER_TEMP/agp9-build.log"
            rc=${PIPESTATUS[0]}
            [ "$rc" -eq 0 ] && exit 0
            grep -q "preparing SDK package NDK" "$RUNNER_TEMP/agp9-build.log" || exit "$rc"
            echo "::warning::the NDK download broke off in attempt $attempt (rc=$rc)"
            rm -rf "$ANDROID_HOME"/ndk/* "$ANDROID_HOME"/.temp
          done
          exit "$rc"

      - name: Assert native libraries merged into the AGP 9 AAR
        run: |
          AAR=example/build/flutter_litert/outputs/aar/flutter_litert-release.aar
          echo "Inspecting $AAR"
          for ABI in arm64-v8a armeabi-v7a x86_64; do
            unzip -l "$AAR" | grep -E "jni/$ABI/libLiteRt\\.so" \
              || { echo "::error::libLiteRt.so missing for $ABI under AGP 9"; exit 1; }
          done
          for ABI in arm64-v8a x86_64; do
            unzip -l "$AAR" | grep -E "jni/$ABI/libLiteRtClGlAccelerator\\.so" \
              || { echo "::error::GPU accelerator missing for $ABI under AGP 9"; exit 1; }
          done
          if unzip -l "$AAR" | grep -q -E 'jni/armeabi-v7a/libLiteRtClGlAccelerator\.so'; then
            echo '::error::GPU accelerator must not be packaged for armeabi-v7a'
            exit 1
          fi
          unzip -l "$AAR" | grep -E 'jni/.*/libtflite_custom_ops\.so' \
            || { echo '::error::CMake custom-ops .so missing from AAR under AGP 9'; exit 1; }
          # LiteRT 1.x is gone: the Interpreter loads from libLiteRt.so.
          if unzip -l "$AAR" | grep -E 'jni/.*/libtensorflowlite_(gpu_|flex_)?jni\.so'; then
            echo '::error::the AAR must not package a LiteRT 1.x library'
            exit 1
          fi
          echo 'AGP 9 build packaged the expected native libraries.'

  build-ios:
    runs-on: macos-15
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - name: Select Xcode 16.4
        run: |
          sudo xcode-select -s /Applications/Xcode_16.4.app/Contents/Developer
          xcodebuild -version
          test "$(xcodebuild -version | head -n 1)" = "Xcode 16.4"

      - name: Install dependencies
        run: flutter pub get

      # Flutter installs plugin podspecs through a local :path, so their
      # `source` field intentionally has no public git/http key. CocoaPods
      # reports that Flutter-specific shape as a warning; all other warnings
      # are fixed in the podspec metadata and the command still performs a
      # complete build. Xcode 16.4 retains the package's documented iOS 13 and
      # macOS 10.15 compatibility floors, which Xcode 27 can no longer lint.
      - name: Lint CocoaPods specifications at compatibility deployment targets
        run: |
          pod lib lint ios/flutter_litert.podspec --allow-warnings
          pod lib lint macos/flutter_litert.podspec --allow-warnings

      - name: Stage patched Core ML framework for SwiftPM tests
        run: |
          ./scripts/use_local_coreml_xcframework.sh \
            "$GITHUB_WORKSPACE/ios/TensorFlowLiteCCoreML.xcframework"

      # Compiles the example app for the simulator against the staged
      # framework, as the simulator integration tests did before they ran.
      # Those tests timed out or failed to launch on their first attempt in 9
      # of 37 runs, so they are out of this workflow and live in
      # device-tests-manual.yml.
      - name: Build the example app for the iOS simulator
        working-directory: example
        run: flutter build ios --simulator --debug
