name: build
on:
  pull_request:
  push:
    branches:
      - main
      - compiled-model

jobs:
  build-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Enable macOS desktop
        run: flutter config --enable-macos-desktop

      - name: Install dependencies
        run: flutter pub get

      - name: Verify formatting
        run: dart format --output=none --set-exit-if-changed .

      - name: Analyze project source
        run: flutter analyze .

      - name: Cache FlexDelegate library (macOS)
        uses: actions/cache@v4
        with:
          path: ~/Library/Caches/flutter_litert
          key: flex-delegate-macos-v1.0.0

      - name: Run tests
        run: flutter test

      - name: Install Flex integration host dependencies
        working-directory: example/flex_test_host
        run: flutter pub get

      - name: Run Flex addon integration tests
        working-directory: example/flex_test_host
        run: flutter test -d macos integration_test

  build-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install Linux desktop dependencies
        run: |
          # GitHub-hosted Ubuntu runners preconfigure Microsoft apt repos
          # (packages.microsoft.com) that intermittently return 403 / "no longer
          # signed", which makes "apt-get update" exit 100 even though the build
          # only needs standard Ubuntu packages. Drop those third-party repos
          # first; the glob cannot match the main ubuntu.sources file.
          sudo rm -f /etc/apt/sources.list.d/*microsoft* /etc/apt/sources.list.d/*azure*
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev liblzma-dev xvfb

      - name: Enable Linux desktop
        run: flutter config --enable-linux-desktop

      - name: Install dependencies
        run: flutter pub get

      - name: Verify formatting
        run: dart format --output=none --set-exit-if-changed .

      - name: Analyze project source
        run: flutter analyze .

      - name: Cache FlexDelegate library (Linux)
        uses: actions/cache@v4
        with:
          path: ~/.cache/flutter_litert
          key: flex-delegate-linux-v1.0.0

      # CompiledModel tests load the bundled linux/lib/libLiteRt.so via the
      # loader's package-path fallback — the same binary end users get.
      - name: Run tests
        run: flutter test

      - name: Install Flex integration host dependencies
        working-directory: example/flex_test_host
        run: flutter pub get

      - name: Run Flex addon integration tests
        working-directory: example/flex_test_host
        run: xvfb-run -a flutter test -d linux integration_test

      # Builds the example app and runs real CompiledModel inference inside
      # it, proving the production load path end to end: CMake bundles
      # linux/lib/libLiteRt.so into the app bundle and the loader resolves it
      # from execDir/lib. GPU tests skip (runners have no GPU and the GPU
      # accelerator library is not bundled on Linux).
      - name: Run CompiledModel integration tests (Linux desktop)
        working-directory: example
        run: xvfb-run -a flutter test integration_test/compiled_model_test.dart -d linux --timeout 600s

  build-windows:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install dependencies
        run: flutter pub get

      # Windows has no committed classic TFLite library for host tests, so
      # only the CompiledModel suite runs here, loading the bundled
      # windows/libLiteRt.dll via the loader's package-path fallback. This
      # job also guards the MSVC LiteRtLayout ABI handling (72/76-byte
      # struct sizes).
      - name: Run CompiledModel smoke tests
        run: flutter test test/compiled_model_smoke_test.dart

      # Builds the example app and runs real CompiledModel inference inside
      # it — the only place windows/CMakeLists.txt is configured in CI —
      # proving the production load path end to end: CMake bundles
      # libLiteRt.dll next to the executable and the loader resolves it from
      # execDir. GPU tests skip (runners have no GPU and the GPU accelerator
      # library is not bundled on Windows).
      - name: Run CompiledModel integration tests (Windows desktop)
        working-directory: example
        run: flutter test integration_test/compiled_model_test.dart -d windows --timeout 600s

  build-android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Enable KVM for hardware-accelerated emulation
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      # Runs real CompiledModel inference (CPU; strict-GPU skips — emulators
      # have no working OpenCL) against libLiteRt.so bundled by the Gradle
      # download task.
      - name: Run CompiledModel integration tests (Android emulator)
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          profile: pixel_6
          working-directory: example
          script: flutter test integration_test/compiled_model_test.dart -d emulator-5554 --timeout 600s

  build-ios:
    runs-on: macos-latest
    # Per-attempt timeout + one retry live in the test step below; this outer
    # cap only bounds the retry total (was 30 when a single hang had no retry).
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Boot iOS simulator
        run: |
          UDID=$(xcrun simctl list devices available --json | python3 -c "
          import json, sys
          devices = json.load(sys.stdin)['devices']
          iphones = [d for v in devices.values() for d in v if 'iPhone' in d['name']]
          print(iphones[-1]['udid'])
          ")
          xcrun simctl boot "$UDID" || true
          # Block until the simulator is fully booted before any app launch.
          # Launching the test app on a not-yet-ready simulator was the cause of
          # the connect-forever hangs (build succeeds, driver never attaches).
          xcrun simctl bootstatus "$UDID" -b
          open -a Simulator --args -CurrentDeviceUDID "$UDID" || true
          echo "SIMULATOR_UDID=$UDID" >> "$GITHUB_ENV"

      - name: Run CompiledModel integration tests (iOS simulator)
        working-directory: example
        run: |
          set +e
          # Per-attempt hard cap so a simulator-launch hang (app builds but the
          # test driver never connects) fails this attempt fast and retries,
          # instead of silently consuming the whole job budget.
          attempt_timeout=1200
          max=2
          rc=1
          for attempt in $(seq 1 "$max"); do
            echo "::group::iOS integration tests (attempt $attempt/$max)"
            flutter test integration_test/compiled_model_test.dart \
              -d "$SIMULATOR_UDID" --timeout 600s &
            pid=$!
            ( sleep "$attempt_timeout"
              echo "::warning::iOS attempt exceeded ${attempt_timeout}s; killing"
              kill -TERM "$pid" 2>/dev/null
              sleep 15
              kill -KILL "$pid" 2>/dev/null ) &
            watchdog=$!
            wait "$pid"
            rc=$?
            kill -TERM "$watchdog" 2>/dev/null
            wait "$watchdog" 2>/dev/null
            echo "::endgroup::"
            if [ "$rc" -eq 0 ]; then
              echo "iOS integration tests passed on attempt $attempt"
              break
            fi
            echo "::warning::iOS attempt $attempt failed/timed out (rc=$rc)"
            if [ "$attempt" -lt "$max" ]; then
              echo "Recycling simulator before retry"
              xcrun simctl shutdown "$SIMULATOR_UDID" 2>/dev/null || true
              xcrun simctl boot "$SIMULATOR_UDID" 2>/dev/null || true
              xcrun simctl bootstatus "$SIMULATOR_UDID" -b 2>/dev/null || true
            fi
          done
          exit $rc
