name: Build TFLite C dylib for macOS (bazel arm64 + CMake x86_64)

# Builds the universal libtensorflowlite_c-mac.dylib that is committed at
#   macos/flutter_litert/Sources/flutter_litert/Resources/libtensorflowlite_c-mac.dylib
#
# arm64 slice: bazel. The CMake build leaves ruy effectively single-threaded on
# macOS, so every ruy-backed builtin op (TRANSPOSE_CONV, FULLY_CONNECTED,
# BATCH_MATMUL...) ran up to 3x slower than the bazel build. See
# doc/macos_transpose_conv_gap.md.
#
# x86_64 slice: CMake, on an Intel runner. bazel cannot cross-compile the
# x86_64 slice on an arm64 runner ('NEON_2_SSE.h' file not found), and the
# shipped Intel slice has always been a CMake build, so this keeps Intel Macs
# on the same build system as before.
#
# Two CMake traps in TF 2.21.0 (both silently produce a wrong library):
#   1. Without -DTENSORFLOW_SOURCE_DIR, tensorflow/lite/CMakeLists.txt
#      FetchContent-clones TensorFlow v2.19.0 and builds THAT. The configure
#      step passes the checkout and fails if the clone message appears.
#   2. tensorflow/lite/version.h defaults TF_MINOR_VERSION to 19, and
#      lite/CMakeLists.txt adds a PRIVATE TF_MINOR_VERSION=19 define. c_api.cc
#      (TfLiteVersion) is compiled in the tensorflowlite_c target, which does
#      not see that PRIVATE define, so it would report 2.19.0. The patch step
#      rewrites both to the version in tensorflow/tf_version.bzl.
# The smoke test runs TfLiteVersion() and a real model on each slice.
#
# The output is an Actions artifact with a .sha256 file next to it. Hosting
# and committing the dylib are separate, manual steps.

on:
  workflow_dispatch:
    inputs:
      tf_ref:
        description: TensorFlow git ref to build
        default: v2.21.0
        required: true
      arm64_runner:
        description: Runner for the bazel arm64 slice and packaging
        default: macos-15
        required: true
      x86_64_runner:
        description: Intel runner for the CMake x86_64 slice
        default: macos-15-intel
        required: true

permissions:
  contents: read

env:
  BAZEL_VERSION: 7.7.0
  TF_REF: ${{ inputs.tf_ref || 'v2.21.0' }}
  # Same floors as the 2.20.0 and 2.21.0 dylibs: arm64 minos 14.5,
  # x86_64 LC_VERSION_MIN_MACOSX 10.11.
  ARM64_MIN_MACOS: '14.5'
  X86_64_MIN_MACOS: '10.11'
  COMMITTED_DYLIB: macos/flutter_litert/Sources/flutter_litert/Resources/libtensorflowlite_c-mac.dylib

jobs:
  arm64:
    runs-on: ${{ inputs.arm64_runner || 'macos-15' }}
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install build deps
        run: |
          brew install bazelisk
          pip install numpy
          USE_BAZEL_VERSION=$BAZEL_VERSION bazelisk version
          sw_vers
          xcodebuild -version

      - name: Clone TensorFlow
        run: |
          git clone --depth 1 --branch "$TF_REF" \
            https://github.com/tensorflow/tensorflow.git tf-src
          git -C tf-src rev-parse HEAD
          grep -E '^TF_VERSION' tf-src/tensorflow/tf_version.bzl

      - name: Take the LLVM source archive from bazel's repository cache
        run: bash scripts/use_tf_repo_cache.sh tf-src

      - name: Patch pthreadpool to spin longer on Apple (XNNPACK speed, 4.1.1)
        run: sh scripts/patch_tf_pthreadpool.sh tf-src

      - name: Configure TensorFlow
        working-directory: tf-src
        run: |
          PYTHON_BIN_PATH=$(which python3) \
          TF_NEED_CUDA=0 TF_NEED_ROCM=0 TF_NEED_TENSORRT=0 \
          TF_CONFIGURE_IOS=0 CC_OPT_FLAGS="-O3" \
          python3 configure.py

      # Building both slices in one invocation via --config=macos_arm64 fails
      # with "no such package '@@build_bazel_apple_support//configs/platforms'".
      # --macos_minimum_os pins the floor; without it bazel uses the SDK
      # version of whatever Xcode the runner has.
      - name: Build arm64 slice
        working-directory: tf-src
        run: |
          USE_BAZEL_VERSION=$BAZEL_VERSION bazelisk build -c opt \
            --cpu=darwin_arm64 \
            --macos_minimum_os=$ARM64_MIN_MACOS \
            --define=tflite_with_xnnpack=true \
            //tensorflow/lite/c:tensorflowlite_c
          cp bazel-bin/tensorflow/lite/c/libtensorflowlite_c.dylib \
            ../libtensorflowlite_c-arm64.dylib
          chmod u+w ../libtensorflowlite_c-arm64.dylib

      - name: Smoke test arm64 slice
        run: |
          clang -arch arm64 -O1 -o smoke scripts/tflite_c_smoke.c
          ./smoke "$PWD/libtensorflowlite_c-arm64.dylib" test/assets/add.tflite "${TF_REF#v}"

      - name: Record build info
        run: |
          {
            echo "slice: arm64 (bazel $BAZEL_VERSION, -c opt, --define=tflite_with_xnnpack=true)"
            echo "tf_ref: $TF_REF"
            echo "tf_commit: $(git -C tf-src rev-parse HEAD)"
            echo "runner: $(sw_vers -productVersion) $(xcodebuild -version | head -1)"
          } > build-info-arm64.txt
          shasum -a 256 libtensorflowlite_c-arm64.dylib > libtensorflowlite_c-arm64.dylib.sha256
          cat build-info-arm64.txt libtensorflowlite_c-arm64.dylib.sha256

      - name: Upload arm64 slice
        uses: actions/upload-artifact@v4
        with:
          name: libtensorflowlite_c-mac-arm64
          path: |
            libtensorflowlite_c-arm64.dylib
            libtensorflowlite_c-arm64.dylib.sha256
            build-info-arm64.txt
          if-no-files-found: error

  x86_64:
    runs-on: ${{ inputs.x86_64_runner || 'macos-15-intel' }}
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4

      - name: Toolchain
        run: |
          uname -m
          sw_vers
          xcodebuild -version
          cmake --version

      - name: Clone TensorFlow
        run: |
          git clone --depth 1 --branch "$TF_REF" \
            https://github.com/tensorflow/tensorflow.git tf-src
          git -C tf-src rev-parse HEAD

      - name: Patch pthreadpool to spin longer on Apple (XNNPACK speed, 4.1.1)
        run: sh scripts/patch_tf_pthreadpool.sh tf-src

      # Trap 2: make every translation unit agree on the real version.
      - name: Patch TFLite version defines
        working-directory: tf-src
        run: |
          set -e
          ver=$(sed -n 's/^TF_VERSION = "\([0-9.]*\)".*/\1/p' tensorflow/tf_version.bzl)
          major=$(echo "$ver" | cut -d. -f1)
          minor=$(echo "$ver" | cut -d. -f2)
          patch=$(echo "$ver" | cut -d. -f3)
          echo "tf_version.bzl says $ver"
          test -n "$minor"
          sed -i '' \
            -e "s/^#define TF_MAJOR_VERSION [0-9]*/#define TF_MAJOR_VERSION $major/" \
            -e "s/^#define TF_MINOR_VERSION [0-9]*/#define TF_MINOR_VERSION $minor/" \
            -e "s/^#define TF_PATCH_VERSION [0-9]*/#define TF_PATCH_VERSION $patch/" \
            tensorflow/lite/version.h
          sed -i '' \
            -e "s/TF_MAJOR_VERSION=[0-9]*/TF_MAJOR_VERSION=$major/" \
            -e "s/TF_MINOR_VERSION=[0-9]*/TF_MINOR_VERSION=$minor/" \
            -e "s/TF_PATCH_VERSION=[0-9]*/TF_PATCH_VERSION=$patch/" \
            tensorflow/lite/CMakeLists.txt
          grep -n "define TF_M\|define TF_PATCH" tensorflow/lite/version.h
          grep -n "TF_M[AI]*[JN]*OR_VERSION=\|TF_PATCH_VERSION=" tensorflow/lite/CMakeLists.txt
          grep -q "#define TF_MINOR_VERSION $minor" tensorflow/lite/version.h
          grep -q "TF_MINOR_VERSION=$minor" tensorflow/lite/CMakeLists.txt

      # Trap 1: pass the checkout so CMake does not fetch TF v2.19.0.
      - name: Configure CMake
        run: |
          set -o pipefail
          cmake -S tf-src/tensorflow/lite/c -B build \
            -DCMAKE_BUILD_TYPE=Release \
            -DTENSORFLOW_SOURCE_DIR="$PWD/tf-src" \
            -DTFLITE_ENABLE_XNNPACK=ON \
            -DCMAKE_OSX_ARCHITECTURES=x86_64 \
            -DCMAKE_OSX_DEPLOYMENT_TARGET=$X86_64_MIN_MACOS \
            -DCMAKE_POLICY_VERSION_MINIMUM=3.5 \
            2>&1 | tee cmake-configure.log
          if grep -q "Downloading TensorFlow repository" cmake-configure.log; then
            echo "CMake fetched its own TensorFlow; TENSORFLOW_SOURCE_DIR was ignored"
            exit 1
          fi
          test ! -d build/tensorflow-lite/tensorflow-src

      - name: Build x86_64 slice
        run: |
          cmake --build build --config Release -j "$(sysctl -n hw.ncpu)" \
            --target tensorflowlite_c
          ls -l build/libtensorflowlite_c.dylib
          cp build/libtensorflowlite_c.dylib libtensorflowlite_c-x86_64.dylib

      - name: Smoke test x86_64 slice
        run: |
          clang -arch x86_64 -O1 -o smoke scripts/tflite_c_smoke.c
          ./smoke "$PWD/libtensorflowlite_c-x86_64.dylib" test/assets/add.tflite "${TF_REF#v}"

      - name: Record build info
        run: |
          {
            echo "slice: x86_64 (CMake Release, TFLITE_ENABLE_XNNPACK=ON, deployment target $X86_64_MIN_MACOS)"
            echo "tf_ref: $TF_REF"
            echo "tf_commit: $(git -C tf-src rev-parse HEAD)"
            echo "runner: $(sw_vers -productVersion) $(uname -m) $(xcodebuild -version | head -1)"
          } > build-info-x86_64.txt
          shasum -a 256 libtensorflowlite_c-x86_64.dylib > libtensorflowlite_c-x86_64.dylib.sha256
          cat build-info-x86_64.txt libtensorflowlite_c-x86_64.dylib.sha256

      - name: Upload x86_64 slice
        uses: actions/upload-artifact@v4
        with:
          name: libtensorflowlite_c-mac-x86_64
          path: |
            libtensorflowlite_c-x86_64.dylib
            libtensorflowlite_c-x86_64.dylib.sha256
            build-info-x86_64.txt
            cmake-configure.log
          if-no-files-found: error

  universal:
    needs: [arm64, x86_64]
    runs-on: ${{ inputs.arm64_runner || 'macos-15' }}
    # Joins two slices with lipo and checks the result in a few minutes. A
    # stall must end here, not at the 6 hour limit.
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: libtensorflowlite_c-mac-arm64
          path: slices

      - uses: actions/download-artifact@v4
        with:
          name: libtensorflowlite_c-mac-x86_64
          path: slices

      - name: Check slice checksums
        working-directory: slices
        run: |
          shasum -a 256 -c libtensorflowlite_c-arm64.dylib.sha256
          shasum -a 256 -c libtensorflowlite_c-x86_64.dylib.sha256

      - name: Create universal dylib
        run: |
          set -e
          mkdir -p out
          lipo -create \
            slices/libtensorflowlite_c-arm64.dylib \
            slices/libtensorflowlite_c-x86_64.dylib \
            -output out/libtensorflowlite_c-mac.dylib
          install_name_tool -id @rpath/libtensorflowlite_c-mac.dylib \
            out/libtensorflowlite_c-mac.dylib
          lipo -info out/libtensorflowlite_c-mac.dylib
          # arm64 code must carry a valid signature to load.
          codesign --verify --arch arm64 -v out/libtensorflowlite_c-mac.dylib

      - name: Smoke test universal dylib (arm64, and x86_64 under Rosetta)
        run: |
          set -e
          clang -arch arm64 -arch x86_64 -O1 -o smoke scripts/tflite_c_smoke.c
          arch -arm64 ./smoke "$PWD/out/libtensorflowlite_c-mac.dylib" test/assets/add.tflite "${TF_REF#v}"
          if arch -x86_64 /usr/bin/true 2>/dev/null; then
            arch -x86_64 ./smoke "$PWD/out/libtensorflowlite_c-mac.dylib" test/assets/add.tflite "${TF_REF#v}"
          else
            echo "Rosetta not available; x86_64 slice was smoke-tested natively in the x86_64 job"
          fi

      - name: Compare with the committed dylib
        run: |
          set -o pipefail
          sh scripts/compare_macos_dylib.sh out/libtensorflowlite_c-mac.dylib \
            "$COMMITTED_DYLIB" out/compare 2>&1 | tee out/compare.txt
          cat out/compare.txt >> "$GITHUB_STEP_SUMMARY"

      - name: Checksums
        working-directory: out
        run: |
          shasum -a 256 libtensorflowlite_c-mac.dylib > libtensorflowlite_c-mac.dylib.sha256
          cat libtensorflowlite_c-mac.dylib.sha256
          cp ../slices/build-info-*.txt .
          stat -f "size %z" libtensorflowlite_c-mac.dylib

      - name: Upload universal dylib
        uses: actions/upload-artifact@v4
        with:
          name: libtensorflowlite_c-mac
          path: out/
          if-no-files-found: error
