# Temporary debugging helper for the android-gpu-testlab.yml workflow: pulls
# the raw Firebase Test Lab result artifacts (JUnit XML, instrumentation
# results, filtered logcat) for a finished matrix out of the results GCS
# bucket and prints them in the job log. Costs no Test Lab quota. Remove this
# file once the physical-device GPU gate is stable.
name: Fetch Test Lab results

on:
  workflow_dispatch:
    inputs:
      results_dir:
        description: GCS results directory (gs://... path printed by the test run)
        required: true
        type: string
  # Self-trigger on push so the fetch can run from this feature branch, where
  # workflow_dispatch may not be available yet. Uses the default results dir
  # baked in below.
  push:
    branches:
      - android-gpu-implementation
    paths:
      - .github/workflows/testlab-results-fetch.yml

permissions:
  contents: read

jobs:
  fetch:
    name: Dump Test Lab artifacts
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      RESULTS_DIR: ${{ inputs.results_dir || 'gs://test-lab-7yqvc8ruj90y2-k9u7wfunxj2sa/2026-07-10_23:24:07.404650_vBUM' }}
    steps:
      - uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v3
        with:
          credentials_json: ${{ secrets.FIREBASE_TEST_LAB_CREDENTIALS }}

      - name: Install Google Cloud CLI
        uses: google-github-actions/setup-gcloud@v3

      - name: List result artifacts
        run: gsutil ls -r "$RESULTS_DIR" | tee listing.txt

      - name: Dump JUnit XML and instrumentation results
        run: |
          for f in $(grep -E 'test_result.*\.xml$|instrumentation\.results$' listing.txt); do
            echo "===================== $f"
            gsutil cat "$f"
            echo
          done

      - name: Dump filtered logcat
        run: |
          for f in $(grep -E '/logcat$' listing.txt); do
            echo "===================== $f (filtered)"
            gsutil cat "$f" | grep -iE 'litert|opencl|tflite|accelerator|flutter|androidruntime|fatal|beginning of crash| E | F ' | tail -400
            echo
          done
