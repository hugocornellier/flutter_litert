name: Build TFLite Metal GPU dylib (macOS)

# Builds libtensorflowlite_gpu-mac.dylib (arm64) from TensorFlow with
# patches/gpu_transpose_conv_v4.patch. The output is an Actions artifact with a
# .sha256 file next to it, compared against the committed dylib it replaces.
# Hosting and committing the dylib are separate, manual steps.

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 360
    env:
      TF_VERSION: v2.21.0
      BAZEL_VERSION: 7.7.0
      COMMITTED_DYLIB: macos/flutter_litert/Sources/flutter_litert/Resources/libtensorflowlite_gpu-mac.dylib

    steps:
      - uses: actions/checkout@v4

      - name: Free disk space
        run: |
          echo "Before cleanup:"
          df -h /
          sudo rm -rf /usr/local/share/powershell /usr/local/.ghcup \
            /usr/local/lib/android /usr/local/share/chromium 2>/dev/null || true
          echo "After cleanup:"
          df -h /

      - name: Select Xcode
        run: |
          ls -d /Applications/Xcode*.app || true
          sudo xcode-select -s /Applications/Xcode_16.4.app
          xcode-select -p
          xcodebuild -version
          xcrun --sdk macosx --show-sdk-version
          xcrun --sdk macosx --show-sdk-path

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install numpy
          brew install bazelisk

      - name: Clone TensorFlow
        run: |
          git clone --depth 1 --branch $TF_VERSION \
            https://github.com/tensorflow/tensorflow.git ~/tf-src

      - name: Re-pin the LLVM source archive checksum
        run: sh scripts/pin_tf_llvm_archive.sh ~/tf-src

      - name: Patch apple_support so Objective-C compiles get the Xcode env
        run: sh scripts/patch_tf_apple_support.sh ~/tf-src

      - name: Patch GPU delegate to accept TRANSPOSE_CONV v4
        run: |
          cd ~/tf-src
          git apply --verbose "$GITHUB_WORKSPACE/patches/gpu_transpose_conv_v4.patch"
          echo "=== verify both hunks landed ==="
          grep -n "CheckMaxSupportedOpVersion(registration, 4)" \
            tensorflow/lite/delegates/gpu/common/model_builder.cc
          grep -n "MaybeFuseActivation(tf_options->activation, graph, node)" \
            tensorflow/lite/delegates/gpu/common/model_builder.cc \
            | tail -1

      - name: Configure TensorFlow
        run: |
          cd ~/tf-src
          PYTHON_BIN_PATH=$(which python3) \
          TF_NEED_CUDA=0 TF_NEED_ROCM=0 TF_NEED_TENSORRT=0 \
          CC_OPT_FLAGS="-march=native" \
          python3 configure.py

      # The Objective-C++ compiles (metal/common.mm, coreml_executor.mm) need
      # the apple_support patch above; without it wrapped_clang fails with
      # "Error: DEVELOPER_DIR not set". --cpu=darwin_arm64 as in 2.20.0.
      - name: Build Metal GPU dylib (arm64)
        run: |
          cd ~/tf-src
          USE_BAZEL_VERSION=$BAZEL_VERSION bazelisk build -c opt \
            --copt=-Os \
            --copt=-DTFLITE_GPU_BINARY_RELEASE \
            --copt=-fvisibility=hidden \
            --strip=always \
            --config=macos \
            --cpu=darwin_arm64 \
            --local_ram_resources=HOST_RAM*0.7 \
            --jobs=4 \
            //tensorflow/lite/delegates/gpu:tensorflow_lite_gpu_dylib

      - name: Show Bazel's Xcode configuration
        if: failure()
        run: |
          cd ~/tf-src
          OUTPUT_BASE=$(USE_BAZEL_VERSION=$BAZEL_VERSION bazelisk info output_base)
          cat "$OUTPUT_BASE/external/local_config_xcode/BUILD" || true

      - name: Verify symbols
        run: |
          echo "=== Metal GPU delegate symbols ==="
          nm -gU ~/tf-src/bazel-bin/tensorflow/lite/delegates/gpu/tensorflow_lite_gpu_dylib.dylib \
            | grep -E "TFLGpuDelegate" | head -10
          echo ""
          echo "=== File info ==="
          ls -lh ~/tf-src/bazel-bin/tensorflow/lite/delegates/gpu/tensorflow_lite_gpu_dylib.dylib
          file ~/tf-src/bazel-bin/tensorflow/lite/delegates/gpu/tensorflow_lite_gpu_dylib.dylib

      - name: Rename
        run: |
          mkdir -p ~/out
          cp ~/tf-src/bazel-bin/tensorflow/lite/delegates/gpu/tensorflow_lite_gpu_dylib.dylib \
            ~/out/libtensorflowlite_gpu-mac.dylib

      - name: Compare with the committed dylib
        run: |
          set -o pipefail
          sh scripts/compare_macos_dylib.sh ~/out/libtensorflowlite_gpu-mac.dylib \
            "$COMMITTED_DYLIB" ~/out/compare 2>&1 | tee ~/out/compare.txt
          cat ~/out/compare.txt >> "$GITHUB_STEP_SUMMARY"

      - name: Checksum and build info
        run: |
          cd ~/out
          shasum -a 256 libtensorflowlite_gpu-mac.dylib > libtensorflowlite_gpu-mac.dylib.sha256
          {
            echo "tf_ref: $TF_VERSION"
            echo "tf_commit: $(git -C ~/tf-src rev-parse HEAD)"
            echo "patches: gpu_transpose_conv_v4.patch"
            echo "bazel: $BAZEL_VERSION"
            echo "runner: $(sw_vers -productVersion) $(xcodebuild -version | head -1)"
          } > build-info.txt
          cat build-info.txt libtensorflowlite_gpu-mac.dylib.sha256
          stat -f "size %z" libtensorflowlite_gpu-mac.dylib

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: libtensorflowlite_gpu-mac
          path: ~/out/
          if-no-files-found: error
