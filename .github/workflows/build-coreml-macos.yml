name: Build TFLite CoreML dylib (macOS)

# Builds libtensorflowlite_coreml-mac.dylib (arm64) from TensorFlow with
# patches/coreml_mean_padding.patch. The output is an Actions artifact with a
# .sha256 file next to it, compared against the committed dylib it replaces.
# Hosting and committing the dylib are separate, manual steps.

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 300
    env:
      TF_VERSION: v2.21.0
      BAZEL_VERSION: 7.7.0
      COMMITTED_DYLIB: macos/flutter_litert/Sources/flutter_litert/Resources/libtensorflowlite_coreml-mac.dylib

    steps:
      - uses: actions/checkout@v4

      - name: Free disk space
        run: |
          echo "Before cleanup:"
          df -h /
          sudo rm -rf /usr/local/share/powershell /usr/local/.ghcup \
            /usr/local/lib/android /usr/local/share/chromium 2>/dev/null || true
          echo "After cleanup:"
          df -h /

      - name: Select Xcode
        run: |
          ls -d /Applications/Xcode*.app || true
          sudo xcode-select -s /Applications/Xcode_16.4.app
          xcode-select -p
          xcodebuild -version
          xcrun --sdk macosx --show-sdk-version
          xcrun --sdk macosx --show-sdk-path

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install numpy
          brew install bazelisk

      - name: Clone TensorFlow
        run: |
          git clone --depth 1 --branch $TF_VERSION \
            https://github.com/tensorflow/tensorflow.git ~/tf-src

      - name: Re-pin the LLVM source archive checksum
        run: sh scripts/pin_tf_llvm_archive.sh ~/tf-src

      - name: Patch apple_support so Objective-C compiles get the Xcode env
        run: sh scripts/patch_tf_apple_support.sh ~/tf-src

      - name: Patch CoreML delegate to set MEAN pooling padding type
        run: |
          cd ~/tf-src
          git apply --verbose "$GITHUB_WORKSPACE/patches/coreml_mean_padding.patch"
          echo "=== verify the hunk landed ==="
          grep -n -A2 "set_globalpooling(true)" \
            tensorflow/lite/delegates/coreml/builders/pooling_layer_builder.cc \
            | grep -E "mutable_valid|globalpooling"

      - name: Download and patch coremltools proto imports
        run: |
          cd /tmp
          curl -L -o coremltools.tar.gz https://github.com/apple/coremltools/archive/8.0.tar.gz
          mkdir -p coremltools-local
          tar xzf coremltools.tar.gz -C coremltools-local --strip-components=1

          # Patch proto files: bare imports -> mlmodel/format/ prefixed
          cd coremltools-local/mlmodel/format
          for f in *.proto; do
            sed -i '' 's|import "\([A-Za-z].*\.proto\)"|import "mlmodel/format/\1"|g' "$f"
            sed -i '' 's|import public "\([A-Za-z].*\.proto\)"|import public "mlmodel/format/\1"|g' "$f"
          done

          echo "=== Sample patched imports ==="
          grep 'import' /tmp/coremltools-local/mlmodel/format/CategoricalMapping.proto || true

          # Create WORKSPACE marker so Bazel recognizes it as a repo
          touch /tmp/coremltools-local/WORKSPACE

          # Write BUILD.bazel for the patched coremltools
          {
            echo 'load("@com_google_protobuf//bazel:cc_proto_library.bzl", "cc_proto_library")'
            echo ''
            echo 'package(default_visibility = ["//visibility:public"])'
            echo ''
            echo 'licenses(["notice"])'
            echo ''
            echo 'exports_files(["LICENSE.txt"])'
            echo ''
            echo 'proto_library('
            echo '    name = "mlmodel_proto",'
            echo '    srcs = glob(["mlmodel/format/*.proto"]),'
            echo ')'
            echo ''
            echo 'cc_proto_library('
            echo '    name = "mlmodel_cc_proto",'
            echo '    deps = [":mlmodel_proto"],'
            echo ')'
          } > /tmp/coremltools-local/BUILD.bazel

          echo "=== BUILD.bazel ==="
          cat /tmp/coremltools-local/BUILD.bazel

      - name: Patch CoreML BUILD to add macos_dylib target
        run: |
          cd ~/tf-src
          {
            echo ''
            echo 'load("@build_bazel_rules_apple//apple:macos.bzl", "macos_dylib")'
            echo ''
            echo 'macos_dylib('
            echo '    name = "tensorflow_lite_coreml_dylib",'
            echo '    linkopts = ['
            echo '        "-all_load",'
            echo '        "-dead_strip",'
            echo '    ],'
            echo '    minimum_os_version = "12.0",'
            echo '    tags = ['
            echo '        "manual",'
            echo '        "nobuilder",'
            echo '        "notap",'
            echo '    ],'
            echo '    deps = ['
            echo '        ":coreml_delegate",'
            echo '    ],'
            echo ')'
          } >> tensorflow/lite/delegates/coreml/BUILD

          echo "=== Patched CoreML BUILD (tail) ==="
          tail -20 tensorflow/lite/delegates/coreml/BUILD

      - name: Configure TensorFlow
        run: |
          cd ~/tf-src
          PYTHON_BIN_PATH=$(which python3) \
          TF_NEED_CUDA=0 TF_NEED_ROCM=0 TF_NEED_TENSORRT=0 \
          CC_OPT_FLAGS="-march=native" \
          python3 configure.py

      # The Objective-C++ compiles (metal/common.mm, coreml_executor.mm) need
      # the apple_support patch above; without it wrapped_clang fails with
      # "Error: DEVELOPER_DIR not set". --cpu=darwin_arm64 as in 2.20.0.
      - name: Build CoreML dylib (arm64)
        run: |
          cd ~/tf-src
          USE_BAZEL_VERSION=$BAZEL_VERSION bazelisk build -c opt \
            --copt=-Os \
            --copt=-fvisibility=default \
            --strip=always \
            --config=macos \
            --cpu=darwin_arm64 \
            --local_ram_resources=HOST_RAM*0.7 \
            --jobs=4 \
            --override_repository=coremltools=/tmp/coremltools-local \
            //tensorflow/lite/delegates/coreml:tensorflow_lite_coreml_dylib

      - name: Show Bazel's Xcode configuration
        if: failure()
        run: |
          cd ~/tf-src
          OUTPUT_BASE=$(USE_BAZEL_VERSION=$BAZEL_VERSION bazelisk info output_base)
          cat "$OUTPUT_BASE/external/local_config_xcode/BUILD" || true

      - name: Verify symbols
        run: |
          echo "=== CoreML delegate symbols ==="
          nm -gU ~/tf-src/bazel-bin/tensorflow/lite/delegates/coreml/tensorflow_lite_coreml_dylib.dylib \
            | grep -E "TfLiteCoreM" | head -10
          echo ""
          echo "=== File info ==="
          ls -lh ~/tf-src/bazel-bin/tensorflow/lite/delegates/coreml/tensorflow_lite_coreml_dylib.dylib
          file ~/tf-src/bazel-bin/tensorflow/lite/delegates/coreml/tensorflow_lite_coreml_dylib.dylib

      - name: Rename
        run: |
          mkdir -p ~/out
          cp ~/tf-src/bazel-bin/tensorflow/lite/delegates/coreml/tensorflow_lite_coreml_dylib.dylib \
            ~/out/libtensorflowlite_coreml-mac.dylib

      - name: Compare with the committed dylib
        run: |
          set -o pipefail
          sh scripts/compare_macos_dylib.sh ~/out/libtensorflowlite_coreml-mac.dylib \
            "$COMMITTED_DYLIB" ~/out/compare 2>&1 | tee ~/out/compare.txt
          cat ~/out/compare.txt >> "$GITHUB_STEP_SUMMARY"

      - name: Checksum and build info
        run: |
          cd ~/out
          shasum -a 256 libtensorflowlite_coreml-mac.dylib > libtensorflowlite_coreml-mac.dylib.sha256
          {
            echo "tf_ref: $TF_VERSION"
            echo "tf_commit: $(git -C ~/tf-src rev-parse HEAD)"
            echo "patches: coreml_mean_padding.patch"
            echo "bazel: $BAZEL_VERSION"
            echo "runner: $(sw_vers -productVersion) $(xcodebuild -version | head -1)"
          } > build-info.txt
          cat build-info.txt libtensorflowlite_coreml-mac.dylib.sha256
          stat -f "size %z" libtensorflowlite_coreml-mac.dylib

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: libtensorflowlite_coreml-mac
          path: ~/out/
          if-no-files-found: error
